<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Map builder</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#17212b;font-family:Inter,Segoe UI,sans-serif}.app{padding:18px;max-width:1900px;margin:auto}.card{background:#fff;border:1px solid #e5e9ed;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #14283a0d}.title{padding:18px 20px 8px;font-size:20px;font-weight:700}.bar{display:flex;gap:18px;align-items:center;padding:9px 20px 10px;border-bottom:1px solid #e5e9ed}.ctrl{display:grid;grid-template-columns:auto 108px max-content;gap:7px;align-items:center;font-size:11px;color:#707986}.ctrl select{width:130px;padding:7px;border:1px solid #dfe5e9;border-radius:8px;background:#fff}.ctrl input{appearance:none;width:108px;height:4px;border-radius:9px;background:#dce3e8}.ctrl input::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:#172b3f;border:3px solid #fff;box-shadow:0 1px 5px #0003}.ctrl b{color:#17212b;font-weight:500}.status{margin:0;padding:10px 20px;color:#8b1e1e;background:#fff1f1;display:none}.status.on{display:block}.map{height:610px}.note{padding:9px 16px;font-size:10px;color:#707986}</style><div class="app"><div class="card"><div class="title">Enter title here</div><div class="bar"><label class="ctrl">Map type<select id="type"><option value="auto">Auto</option><option value="points">Points</option><option value="bubbles">Bubbles</option><option value="area">Shaded areas</option></select></label><label class="ctrl">Geography<select id="geo"><option value="auto">Auto detect</option><option value="postcode">Postcode</option><option value="coords">Latitude / longitude</option><option value="ward">UK wards</option><option value="council">UK councils</option></select></label><label class="ctrl">Size<input id="size" type="range" min="4" max="28" value="9"><b id="sv">9</b></label><label class="ctrl">Opacity<input id="op" type="range" min="20" max="100" value="80"><b id="ov">80%</b></label></div><div id="status" class="status"></div><div id="map" class="map"></div><div class="note">Postcodes are converted with Postcodes.io. Do not paste personal or sensitive data.</div></div></div><script>'use strict';let M=[[]],mp=L.map(document.getElementById('map')).setView([54.4,-3.3],6),over=[];L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(mp);const $=s=>document.querySelector(s),cl=v=>String(v??'').trim(),nm=v=>cl(v).toUpperCase().replace(/[^A-Z0-9]/g,''),nu=v=>{let x=cl(v).replace(/[,£$%]/g,'');return /^[-+]?\d*\.?\d+$/.test(x)?+x:NaN},alias={postcode:['POSTCODE'],lat:['LAT','LATITUDE'],lon:['LON','LNG','LONGITUDE'],ward:['WARD','WARDNAME'],council:['COUNCIL','BOROUGH','LOCALAUTHORITY'],value:['VALUE','COUNT','TOTAL','NUMBER','AMOUNT'],category:['CATEGORY','TYPE','SERVICE'],label:['LABEL','NAME','SITE','FACILITY']},ix=(h,a)=>h.findIndex(x=>a.includes(nm(x)));function clear(){over.forEach(x=>mp.removeLayer(x));over=[];$('#status').className='status'}function err(x){$('#status').textContent=x;$('#status').className='status on'}async function build(){clear();let r=M.filter(x=>x.some(cl));if(r.length<2)return;let h=r[0],d=r.slice(1),I=Object.fromEntries(Object.entries(alias).map(([k,a])=>[k,ix(h,a)])),g=$('#geo').value,t=$('#type').value;if(g==='auto')g=I.postcode>=0?'postcode':I.lat>=0&&I.lon>=0?'coords':I.ward>=0?'ward':I.council>=0?'council':'';if(t==='auto')t=['ward','council'].includes(g)?'area':I.value>=0?'bubbles':'points';try{if(t==='area'){let ni=g==='ward'?I.ward:I.council,field=g==='ward'?'WD25NM':'LAD25NM',service=g==='ward'?'WD_MAY_2025_UK_BGC_V2':'LAD_MAY_2025_UK_BGC_V2',vals=new Map(d.map(x=>[nm(x[ni]),nu(x[I.value])]).filter(x=>x[0]&&Number.isFinite(x[1]))),names=d.map(x=>cl(x[ni])).filter(Boolean).map(x=>"'"+x.replace(/'/g,"''")+"'").join(','),url='https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/'+service+'/FeatureServer/0/query?where='+encodeURIComponent(field+' IN ('+names+')')+'&outFields=*&returnGeometry=true&outSR=4326&f=geojson',res=await fetch(url),gj=await res.json();if(!Array.isArray(gj.features))throw Error('Boundary data could not be loaded.');let vs=[...vals.values()],lo=Math.min(...vs),hi=Math.max(...vs),ly=L.geoJSON(gj,{style:f=>{let v=vals.get(nm(f.properties[field])),q=(v-lo)/(hi-lo||1);return{color:'#fff',weight:1,fillColor:`rgb(${Math.round(234-181*q)},${Math.round(240-202*q)},255)`,fillOpacity:+$('#op').value/100}},onEachFeature:(f,l)=>{let v=vals.get(nm(f.properties[field]));l.bindPopup('<b>'+f.properties[field]+'</b><br>'+v)}}).addTo(mp);over.push(ly);mp.fitBounds(ly.getBounds())}else{let look=new Map;if(g==='postcode'){let pcs=[...new Set(d.map(x=>cl(x[I.postcode])).filter(Boolean))];for(let i=0;i<pcs.length;i+=100){let z=await fetch('https://api.postcodes.io/postcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postcodes:pcs.slice(i,i+100)})}).then(x=>x.json());z.result.forEach(x=>x.result&&look.set(nm(x.query),x.result))}}let fg=L.featureGroup().addTo(mp);over.push(fg);for(let x of d){let a=I.lat>=0?nu(x[I.lat]):NaN,o=I.lon>=0?nu(x[I.lon]):NaN,pc=I.postcode>=0?cl(x[I.postcode]):'';if((!Number.isFinite(a)||!Number.isFinite(o))&&pc){let z=look.get(nm(pc));if(z){a=z.latitude;o=z.longitude}}if(!Number.isFinite(a)||!Number.isFinite(o))continue;let v=I.value>=0?nu(x[I.value]):1,rad=t==='bubbles'?Math.max(4,Math.sqrt(Math.max(1,v))):+$('#size').value,Ly=L.circleMarker([a,o],{radius:rad,fillColor:'#5653FF',color:'#fff',weight:1.5,fillOpacity:+$('#op').value/100}).addTo(fg);Ly.bindPopup('<b>'+(I.label>=0?cl(x[I.label]):pc||'Location')+'</b><br>'+(Number.isFinite(v)?v:''))}if(fg.getLayers().length)mp.fitBounds(fg.getBounds().pad(.12));else throw Error('No valid locations were found.')}}catch(e){err(e.message)}}['type','geo'].forEach(x=>$('#'+x).onchange=build);['size','op'].forEach(x=>$('#'+x).oninput=()=>{$('#'+(x==='size'?'sv':'ov')).textContent=$('#'+x).value+(x==='op'?'%':'');build()});window.chartBridge={setData(x){M=(x||[]).map(r=>r.slice());build()},resetAll(){M=[[]];clear()}};</script>
